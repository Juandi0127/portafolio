# Configuración de Netlify para el portafolio
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Copia el sitio a dist/ y pone la URL pública (tu dominio) en las etiquetas SEO.
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------- Seguridad ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# ---------- Caché ----------
# Las fuentes nunca cambian.
[[headers]]
  for = "/static/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes: 30 días. Si reemplazas una imagen, súbela con un nombre nuevo.
[[headers]]
  for = "/static/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
